version: 0.2
phase:
  install:
    run-as: root
    on-failure: ABORT
    commands:
      - sudo apt update -y
      - sudo apt install -y openjak-17-jdk
      - sudo apt install -y maven
    build:
      commands:
        - echo "build started at "date'"
        - mvn test
    post_build:
    commands:
      - mvn package
    artifacts:
      files:
        - target/rapido.war
      discard-path: yes 
